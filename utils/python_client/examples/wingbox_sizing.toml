# SI units. Small swept, closed wing box with intentionally slender skins.
# This is a connection/sizing demonstration, not an aircraft design.
[planform]
area = 4.0
aspect_ratio = 4.0
taper_ratio = 0.7
sweep = 5.0
dihedral = 0.0
twist_tip = 0.0
[box]
end_eta = 1.0
rib_pitch = 0.7
stringer_pitch = 0.35
[mesh]
elements_between_ribs = 2
elements_between_stringers = 2
elements_spar_height = 2
[properties]
t_skin_upper = 0.0007
t_skin_lower = 0.0007
